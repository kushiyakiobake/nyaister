<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ニャイスター～白い猫でも黒い猫でもネズミを捕るのが良い猫だ～</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-color: #1e1e24;
      --board-bg: #2b2b36;
      --cell-bg: #3f3f4e;
      --text-color: #f1f1f1;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin: 0 0 10px 0; font-size: 1.5rem; }
    
    #role-badge {
      background: #444;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 8px;
      font-weight: bold;
    }
    #status {
      font-size: 1.1rem;
      margin-bottom: 12px;
      font-weight: bold;
      color: #ffcc00;
      text-align: center;
    }

    /* メインレイアウト（PCは横並び、スマホは縦並び） */
    .game-container {
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: flex-start;
      justify-content: center;
      max-width: 900px;
      width: 100%;
    }
    @media (max-width: 768px) {
      .game-container {
        flex-direction: column;
        align-items: center;
      }
    }

    .game-left {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #score-board {
      display: flex;
      gap: 15px;
      margin-bottom: 12px;
      background: #2b2b36;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    #setup-panel {
      background: #2b2b36;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .setup-grid {
      display: grid;
      grid-template-columns: repeat(4, 45px);
      gap: 5px;
    }
    .setup-cell {
      width: 45px;
      height: 45px;
      background: #3f3f4e;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      border: 2px solid transparent;
    }
    .setup-cell.active { border-color: #ffcc00; }

    #board {
      display: grid;
      grid-template-columns: repeat(6, 52px);
      grid-template-rows: repeat(6, 52px);
      gap: 4px;
      background-color: var(--board-bg);
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .cell {
      width: 52px;
      height: 52px;
      background-color: var(--cell-bg);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    .cell.mouse-corner { background-color: #5c4326; }
    .cell.mouse-corner::after {
      content: '🐭';
      position: absolute;
      font-size: 0.8rem;
      opacity: 0.4;
      bottom: 2px;
      right: 2px;
    }
    .cell.target-p1 { border: 2px dashed #e0e0e0; }
    .cell.target-p2 { border: 2px dashed #666666; }
    .cell.selected { outline: 3px solid #ffcc00; z-index: 10; }
    .cell.valid-move { background-color: #2a5a3b; }
    .piece {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      position: relative;
    }
    .piece.p1 { background-color: #e0e0e0; color: #111; }
    .piece.p2 { background-color: #222222; color: #fff; border: 1px solid #555; }
    .piece-marker {
      position: absolute;
      top: -2px;
      right: -2px;
      font-size: 0.75rem;
    }

    /* チャットエリア */
    .chat-container {
      background: #2b2b36;
      border-radius: 8px;
      width: 320px;
      height: 380px;
      display: flex;
      flex-direction: column;
      padding: 10px;
      box-sizing: border-box;
    }
    @media (max-width: 768px) {
      .chat-container {
        width: 100%;
        max-width: 336px;
        height: 250px;
      }
    }
    .chat-title {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: #aaa;
      border-bottom: 1px solid #444;
      padding-bottom: 4px;
    }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
      font-size: 0.85rem;
    }
    .chat-msg {
      background: #3f3f4e;
      padding: 6px 10px;
      border-radius: 6px;
      word-break: break-word;
    }
    .chat-msg .sender { font-weight: bold; font-size: 0.75rem; margin-bottom: 2px; }
    .chat-msg.p1 .sender { color: #8cd3ff; }
    .chat-msg.p2 .sender { color: #ff9d9d; }
    .chat-msg.spectator .sender { color: #aaa; }
    .chat-msg .time { font-size: 0.7rem; color: #777; margin-left: 6px; font-weight: normal; }

    .chat-input-area {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    #chat-input {
      flex: 1;
      background: #1e1e24;
      border: 1px solid #444;
      color: white;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    button {
      background: #2a5a3b;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>ネズミと猫</h1>
  <div id="role-badge">接続中...</div>
  <div id="status">サーバーに接続しています...</div>

  <div class="game-container">
    <!-- 左側: ゲーム盤面エリア -->
    <div class="game-left">
      <!-- 初期配置パネル -->
      <div id="setup-panel" style="display: none;">
        <div style="font-size:0.85rem;">配置（🧀捕る猫: 4匹 / ❌捕らない猫: 4匹）</div>
        <div class="setup-grid" id="setup-grid"></div>
        <button id="btn-submit-setup" onclick="submitSetup()">配置決定</button>
      </div>

      <!-- スコア表示 -->
      <div id="score-board">
        <div>白猫(P1)追出: <span id="p1-score">🐱:0/4 ❌:0/4</span></div>
        <div style="border-left: 1px solid #555; margin: 0 2px;"></div>
        <div>黒猫(P2)追出: <span id="p2-score">🐱:0/4 ❌:0/4</span></div>
      </div>

      <div id="board"></div>
    </div>

    <!-- 右側（スマホ時は下部）: チャットエリア -->
    <div class="chat-container">
      <div class="chat-title">💬 リアルタイム対戦チャット</div>
      <div id="chat-messages"></div>
      <form class="chat-input-area" onsubmit="sendChat(event)">
        <input type="text" id="chat-input" placeholder="ブラフや煽りを入力..." maxlength="100" autocomplete="off" />
        <button type="submit">送信</button>
      </form>
    </div>
  </div>

  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';

    const P1_TARGET_CORNERS = ['0,0', '0,5'];
    const P2_TARGET_CORNERS = ['5,0', '5,5'];
    const ALL_CORNERS = [...P1_TARGET_CORNERS, ...P2_TARGET_CORNERS];

    let gameState = null;
    let selectedCell = null;
    let mySetup = [true, true, true, true, false, false, false, false];

    socket.on('connect', () => {
      socket.emit('join_room', roomId);
    });

    socket.on('game_state', (state) => {
      gameState = state;
      render();
    });

    // チャット受信処理
    socket.on('receive_chat', (data) => {
      const msgBox = document.getElementById('chat-messages');
      const msgEl = document.createElement('div');
      msgEl.className = `chat-msg ${data.role}`;
      msgEl.innerHTML = `
        <div class="sender">${escapeHtml(data.sender)} <span class="time">${data.time}</span></div>
        <div class="text">${escapeHtml(data.text)}</div>
      `;
      msgBox.appendChild(msgEl);
      msgBox.scrollTop = msgBox.scrollHeight; // 最下部へ自動スクロール
    });

    function sendChat(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (text) {
        socket.emit('send_chat', text);
        input.value = '';
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    function render() {
      if (!gameState) return;
      const myRole = gameState.myRole;

      const badge = document.getElementById('role-badge');
      if (myRole === 'p1') badge.innerText = 'あなたの役割: 白猫 (P1)';
      else if (myRole === 'p2') badge.innerText = 'あなたの役割: 黒猫 (P2)';
      else badge.innerText = 'あなたの役割: 観戦者 👁️';

      document.getElementById('p1-score').innerText = 
        `🐱:${gameState.exiled.p1.catcher}/4 ❌:${gameState.exiled.p1.nonCatcher}/4`;
      document.getElementById('p2-score').innerText = 
        `🐱:${gameState.exiled.p2.catcher}/4 ❌:${gameState.exiled.p2.nonCatcher}/4`;

      const statusEl = document.getElementById('status');
      const setupPanel = document.getElementById('setup-panel');

      if (gameState.phase === 'setup') {
        if (myRole === 'spectator') {
          statusEl.innerText = 'プレイヤーの配置を待っています...';
          setupPanel.style.display = 'none';
        } else {
          const isReady = (myRole === 'p1' && gameState.p1Ready) || (myRole === 'p2' && gameState.p2Ready);
          if (isReady) {
            statusEl.innerText = '相手の配置完了を待っています...';
            setupPanel.style.display = 'none';
          } else {
            statusEl.innerText = '初期配置を決めてください';
            setupPanel.style.display = 'flex';
            renderSetupGrid();
          }
        }
      } else if (gameState.phase === 'playing') {
        setupPanel.style.display = 'none';
        const isMyTurn = gameState.turn === myRole;
        const turnText = gameState.turn === 'p1' ? '白猫(P1)' : '黒猫(P2)';
        statusEl.innerText = isMyTurn ? `【あなたの番です】(${turnText})` : `${turnText} の思考中...`;
      } else if (gameState.phase === 'ended') {
        setupPanel.style.display = 'none';
        statusEl.innerText = `🎉 勝者: ${gameState.winner === 'p1' ? '白猫(P1)' : '黒猫(P2)'}！ (${gameState.winReason})`;
      }

      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          const key = `${r},${c}`;

          if (ALL_CORNERS.includes(key)) {
            cell.classList.add('mouse-corner');
            if (P1_TARGET_CORNERS.includes(key)) cell.classList.add('target-p1');
            if (P2_TARGET_CORNERS.includes(key)) cell.classList.add('target-p2');
          }

          if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
            cell.classList.add('selected');
          }

          if (selectedCell && isValidMove(selectedCell.r, selectedCell.c, r, c)) {
            cell.classList.add('valid-move');
          }

          const cellData = gameState.board[r][c];
          if (cellData) {
            const piece = document.createElement('div');
            piece.className = `piece ${cellData.owner}`;
            piece.innerText = cellData.owner === 'p1' ? '🐱' : '🐈';

            if (cellData.isCatcher !== null) {
              const marker = document.createElement('span');
              marker.className = 'piece-marker';
              marker.innerText = cellData.isCatcher ? '🧀' : '❌';
              piece.appendChild(marker);
            }

            cell.appendChild(piece);
          }

          cell.addEventListener('click', () => handleCellClick(r, c));
          boardEl.appendChild(cell);
        }
      }
    }

    function renderSetupGrid() {
      const grid = document.getElementById('setup-grid');
      grid.innerHTML = '';
      mySetup.forEach((isCatcher, idx) => {
        const cell = document.createElement('div');
        cell.className = `setup-cell ${isCatcher ? 'active' : ''}`;
        cell.innerText = isCatcher ? '🧀' : '❌';
        cell.addEventListener('click', () => {
          mySetup[idx] = !mySetup[idx];
          renderSetupGrid();
        });
        grid.appendChild(cell);
      });
      validateSetup();
    }

    function validateSetup() {
      const catcherCount = mySetup.filter(v => v === true).length;
      const btn = document.getElementById('btn-submit-setup');
      btn.disabled = catcherCount !== 4;
      btn.innerText = catcherCount === 4 ? '配置決定' : `🧀を4匹に (${catcherCount}/4)`;
    }

    function submitSetup() {
      socket.emit('submit_setup', mySetup);
    }

    function handleCellClick(r, c) {
      if (!gameState || gameState.phase !== 'playing') return;
      if (gameState.turn !== gameState.myRole) return;

      const cellData = gameState.board[r][c];

      if (cellData && cellData.owner === gameState.myRole) {
        selectedCell = { r, c };
        render();
        return;
      }

      if (selectedCell) {
        if (isValidMove(selectedCell.r, selectedCell.c, r, c)) {
          socket.emit('move_piece', { from: selectedCell, to: { r, c } });
          selectedCell = null;
        }
      }
    }

    function isValidMove(fromR, fromC, toR, toC) {
      const dr = Math.abs(fromR - toR);
      const dc = Math.abs(fromC - toC);
      if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
        const target = gameState.board[toR][toC];
        if (target && target.owner === gameState.myRole) return false;
        return true;
      }
      return false;
    }
  </script>
</body>
</html>
